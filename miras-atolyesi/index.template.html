<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#211409">
    <meta name="description" content="Miras Atölyesi: Teldeki Sevda. Halk Ozanı ile türkünü yaz, gözden geçir ve atölyenin açılışına katıl.">
    <title>Miras Atölyesi · Teldeki Sevda</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23422410'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='46' fill='%23f4ca74'%3E♪%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/game.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <section class="stage" id="stage" aria-label="Miras Atölyesi oyun alanı">
        <div class="artwork" aria-hidden="true">
          <div class="scene-fallback">
            <div class="fallback-paper"></div>
          </div>
          <img id="intro-art" class="scene-image" alt="" hidden>
          <img id="game-art" class="scene-image" alt="" hidden>
        </div>

        <button id="play-hotspot" class="play-hotspot" type="button" aria-label="Oyuna başla"><span aria-hidden="true">▶</span> OYNA</button>

        <section class="parchment" id="parchment" aria-label="Oyun metni ve yanıt alanı" tabindex="-1">
          <div id="panel" class="panel"></div>
        </section>
      </section>
      <footer class="shell-footer"><span>MİRAS ATÖLYESİ <i>·</i> TELDEKİ SEVDA</span><span>Bir türkü de sen yaz.</span></footer>
    </main>
    <noscript>Bu etkileşimli oyun için tarayıcınızda JavaScript'i etkinleştirin.</noscript>
  </body>
</html>
